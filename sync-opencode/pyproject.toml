[project]
name = "sync-opencode"
version = "0.1.0"
description = "Bridge ~/.claude config to ~/.config/opencode. Single source of truth lives in ~/.claude."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
sync-opencode = "sync_opencode.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["sync_opencode"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
